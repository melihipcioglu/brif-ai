    variants:
      - branch: "STABLE"
        prompt_text: "Seçtiğiniz diğer tekrarlanan gün durumunu kısaca tanımlar mısınız?"
        respondent_instruction: "Lütfen bu günün genel niteliğini tek bir cümleyle açıklayın. Saat saat detaylı program vermeniz gerekmemektedir."
