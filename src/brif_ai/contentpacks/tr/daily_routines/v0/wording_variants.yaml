# BRIF.AI Daily Routines v0 Wording Variants Catalog
schema_version: "v0"

wording_variants:
  - question_id: "q_daily_routines_functional_space_day_pattern_status"
    variants:
      - branch: "STABLE"
        prompt_text: "Mevcut evinizdeki gün düzeninizi aşağıdakilerden hangisi daha iyi açıklar?"
        respondent_instruction: "Gününüzün akışı genelde benzer zamanlarda gerçekleşiyorsa veya belirli aralıklarla tekrarlanan bir programınız (nöbet/vardiya dahil) varsa bunu belirtebilirsiniz."
      - branch: "IRREGULAR"
        prompt_text: "Mevcut evinizdeki gün düzeninizi aşağıdakilerden hangisi daha iyi açıklar?"
