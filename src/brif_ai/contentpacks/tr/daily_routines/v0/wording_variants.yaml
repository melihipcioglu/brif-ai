    variants:
      - branch: "STABLE"
        prompt_text: "Seçtiğiniz tipik gün bağlamında, evinizdeki yaşam ve sosyal etkileşim alanının (salon, oturma alanı vb.) kullanım durumunu aşağıdakilerden hangisi en iyi açıklar?"
        respondent_instruction: "Ev içinde bir arada vakit geçirme, dinlenme ve sosyal kullanımın gerçekleştiği alanı düşünün. Ayrı bir oda olması şart değildir."
