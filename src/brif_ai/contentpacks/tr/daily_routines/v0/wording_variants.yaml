  - question_id: "q_daily_routines_functional_space_recurring_day_context"
    variants:
      - branch: "STABLE"
        prompt_text: "Evdeki günlük kullanım alanlarınızı tanımlamak için aşağıdaki tekrarlanan gün durumlarından hangisini esas alalım?"
        respondent_instruction: "Lütfen başkalarının programından bağımsız olarak, kendi yaşamınızda en belirgin olan tekrarlanan gün durumunu seçin."
      - branch: "IRREGULAR"
        prompt_text: "Evdeki günlük kullanım alanlarınızı tanımlamak için aşağıdaki tekrarlanan gün durumlarından hangisini esas alalım?"
