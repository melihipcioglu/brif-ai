# BRIF.AI Daily Routines v0 Flow Rules and Conditional Routing Contracts
schema_version: "v0"

multi_select_contract:
  min_selected_items: 1
  max_selected_items: 4
  unique_items: true
  canonical_order:
    - "morning"
    - "midday_afternoon"
    - "evening"
    - "night"

