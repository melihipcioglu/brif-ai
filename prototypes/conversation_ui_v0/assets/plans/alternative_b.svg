<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="100%" height="100%" id="planSvgB">
  <defs>
    <style>
      .wall-outer { fill: none; stroke: #1E293B; stroke-width: 7; stroke-linejoin: miter; }
      .wall-inner { fill: none; stroke: #334155; stroke-width: 3.5; stroke-linejoin: round; }
      .room-shape { fill: #FAFAF7; stroke: #CBD5E1; stroke-width: 1.5; cursor: pointer; transition: all 0.2s ease; }
      .room-shape:hover, .room-shape:focus-visible { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2.5; outline: none; }
      .room-shape.selected { fill: #E0F2FE; stroke: #0284C7; stroke-width: 3; }
      .room-title { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; pointer-events: none; }
      .room-area { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #475569; pointer-events: none; }
      .room-tag { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; fill: #2563EB; pointer-events: none; }
      .door-arc { fill: none; stroke: #2563EB; stroke-width: 1.5; stroke-dasharray: 3 2; }
      .window-rect { fill: #FFFFFF; stroke: #0284C7; stroke-width: 2; }
      .stair-tread { stroke: #64748B; stroke-width: 1.5; }
      .sliding-wall { stroke: #10B981; stroke-width: 3; stroke-dasharray: 6 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="840" height="560" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Conceptual Banner -->
  <rect x="25" y="15" width="790" height="28" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="420" y="33" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#1E40AF" text-anchor="middle">
    ⚠️ Kavramsal Ön Taslak Plan — Alternatif B (Esnek Bağlantı) — Şematik Mimari Kat Planı (Ruhsat/Taşıyıcı İddiası İçermez)
  </text>

  <!-- North Arrow -->
  <g transform="translate(780, 75)">
    <circle cx="0" cy="0" r="18" fill="#F8FAFC" stroke="#334155" stroke-width="1.5"/>
    <path d="M0 -12 L6 8 L0 3 L-6 8 Z" fill="#0F172A"/>
    <text x="0" y="17" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#0F172A" text-anchor="middle">K</text>
  </g>

  <!-- ==================================================================== -->
  <!-- FLOOR 1: ZEMİN KAT (GROUND FLOOR) -->
  <!-- ==================================================================== -->
  <g id="floor-ground" data-floor-view="ground">
    <text x="45" y="70" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#0F172A">ZEMİN KAT PLAN ŞEMASI</text>
    <text x="45" y="88" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Açık/Esnek Yaşama, Dönüşebilen Çalışma &amp; Akışkan Mutfak Katı</text>

    <!-- ROOM 1: GİRİŞ VE VESTİYER -->
    <g class="interactive-room-group">
      <rect x="60" y="270" width="130" height="120" rx="4" class="room-shape" 
            data-room="entry" data-floor="ground" tabindex="0" role="button" aria-label="Giriş ve Vestiyer kararını incele"/>
      <text x="125" y="320" class="room-title" text-anchor="middle">Giriş / Vestiyer</text>
      <text x="125" y="338" class="room-area" text-anchor="middle">7 - 9 m²</text>
      <text x="125" y="354" class="room-tag" text-anchor="middle">Zorunlu</text>
    </g>

    <!-- ROOM 2: YAŞAM ALANI (SALON) -->
    <g class="interactive-room-group">
      <rect x="190" y="270" width="240" height="180" rx="4" class="room-shape" 
            data-room="living" data-floor="ground" tabindex="0" role="button" aria-label="Yaşam Alanı kararını incele"/>
      <text x="310" y="350" class="room-title" text-anchor="middle">Yaşam Alanı (Salon)</text>
      <text x="310" y="370" class="room-area" text-anchor="middle">30 - 34 m²</text>
      <text x="310" y="388" class="room-tag" text-anchor="middle">Zorunlu • Açık Akış</text>
    </g>

    <!-- ROOM 3: MUTFAK VE YEMEK (AÇIK ADA MUTFAK) -->
    <g class="interactive-room-group">
      <rect x="190" y="110" width="190" height="160" rx="4" class="room-shape" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"
            data-room="kitchen" data-floor="ground" tabindex="0" role="button" aria-label="Açık Mutfak ve Yemek alanı kararını incele"/>
      <text x="285" y="170" class="room-title" text-anchor="middle" fill="#92400E">Açık Mutfak &amp; Yemek</text>
      <text x="285" y="188" class="room-area" text-anchor="middle">16 - 20 m²</text>
      <text x="285" y="204" class="room-tag" text-anchor="middle" fill="#B45309">Ada Mutfak • Görsel Bağlantı</text>
      <!-- Island Rect -->
      <rect x="235" y="220" width="100" height="30" rx="3" fill="#FDE68A" stroke="#B45309" stroke-width="1"/>
      <text x="285" y="239" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#78350F" text-anchor="middle">Mutfak Adası</text>
    </g>

    <!-- ROOM 4: ESNEK KAYAR PANELSİZ ÇALIŞMA ALANI -->
    <g class="interactive-room-group">
      <rect x="380" y="110" width="160" height="160" rx="4" class="room-shape" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"
            data-room="study" data-floor="ground" tabindex="0" role="button" aria-label="Esnek Çalışma Alanı kararını incele"/>
      <text x="460" y="170" class="room-title" text-anchor="middle" fill="#1E40AF">Esnek Çalışma Alanı</text>
      <text x="460" y="187" class="room-title" text-anchor="middle" font-size="10" fill="#1D4ED8">(Kayar Panelli Dönüşüm)</text>
      <text x="460" y="205" class="room-area" text-anchor="middle">11 - 13 m²</text>
      <text x="460" y="222" class="room-tag" text-anchor="middle">Esnek Bağlantı</text>
    </g>

    <!-- ROOM 5: MİSAFİR / ESNEK ODA -->
    <g class="interactive-room-group">
      <rect x="540" y="110" width="170" height="160" rx="4" class="room-shape" 
            data-room="guest" data-floor="ground" tabindex="0" role="button" aria-label="Misafir Odası kararını incele"/>
      <text x="625" y="180" class="room-title" text-anchor="middle">Misafir / Esnek Oda</text>
      <text x="625" y="198" class="room-area" text-anchor="middle">11 - 13 m²</text>
      <text x="625" y="214" class="room-tag" text-anchor="middle">Muhtemel</text>
    </g>

    <!-- ROOM 6: ORTAK WC -->
    <g class="interactive-room-group">
      <rect x="60" y="110" width="130" height="80" rx="4" class="room-shape" 
            data-room="wc" data-floor="ground" tabindex="0" role="button" aria-label="Ortak WC kararını incele"/>
      <text x="125" y="145" class="room-title" text-anchor="middle">Ortak WC</text>
      <text x="125" y="162" class="room-area" text-anchor="middle">3 - 4 m²</text>
    </g>

    <!-- ROOM 7: DEPOLAMA / KİLER -->
    <g class="interactive-room-group">
      <rect x="60" y="190" width="130" height="80" rx="4" class="room-shape" 
            data-room="storage" data-floor="ground" tabindex="0" role="button" aria-label="Depolama kararını incele"/>
      <text x="125" y="225" class="room-title" text-anchor="middle">Depolama / Kiler</text>
      <text x="125" y="242" class="room-area" text-anchor="middle">4 - 5 m²</text>
    </g>

    <!-- ROOM 8: STAIRCASE & CIRCULATION HALL (ALIGNED AT X=430) -->
    <g class="interactive-room-group">
      <rect x="430" y="270" width="110" height="180" rx="4" class="room-shape" fill="#F8FAFC"
            data-room="stair" data-floor="ground" tabindex="0" role="button" aria-label="Merdiven ve Dolaşım Holü kararını incele"/>
      <text x="485" y="340" class="room-title" text-anchor="middle">Merdiven &amp; Hol</text>
      <text x="485" y="358" class="room-area" text-anchor="middle">10 - 12 m²</text>
      <!-- Stair treads -->
      <line x1="440" y1="285" x2="530" y2="285" class="stair-tread"/>
      <line x1="440" y1="297" x2="530" y2="297" class="stair-tread"/>
      <line x1="440" y1="309" x2="530" y2="309" class="stair-tread"/>
      <line x1="440" y1="321" x2="530" y2="321" class="stair-tread"/>
      <line x1="440" y1="333" x2="530" y2="333" class="stair-tread"/>
      <!-- Climbing direction arrow -->
      <path d="M485 410 L485 375" stroke="#2563EB" stroke-width="2.5"/>
      <polygon points="485,370 480,380 490,380" fill="#2563EB"/>
      <text x="485" y="425" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle">ÇIKIŞ ▲</text>
    </g>

    <!-- ROOM 9: TERAS / AÇIK ALAN -->
    <g class="interactive-room-group">
      <rect x="190" y="450" width="240" height="60" rx="4" class="room-shape" fill="#FFFBEB" stroke-dasharray="4 3"
            data-room="terrace" data-floor="ground" tabindex="0" role="button" aria-label="Peyzaj Terası kararını incele"/>
      <text x="310" y="480" class="room-title" text-anchor="middle" fill="#B45309">Geniş Bahçe Terası (Açık)</text>
      <text x="310" y="496" class="room-area" text-anchor="middle">16 - 20 m² (Açık)</text>
    </g>

    <!-- ARCHITECTURAL WALLS & DOORS -->
    <path d="M60 110 L710 110 L710 270 L540 270 L540 450 L190 450 L190 390 L60 390 Z" class="wall-outer"/>

    <!-- Interior Walls & Sliding Panel Lines -->
    <line x1="190" y1="110" x2="190" y2="390" class="wall-inner"/>
    <line x1="380" y1="110" x2="380" y2="270" class="sliding-wall"/> <!-- Sliding panel boundary -->
    <line x1="540" y1="110" x2="540" y2="270" class="wall-inner"/>
    <line x1="60" y1="190" x2="190" y2="190" class="wall-inner"/>
    <line x1="60" y1="270" x2="710" y2="270" class="wall-inner"/>
    <line x1="430" y1="270" x2="430" y2="450" class="wall-inner"/>

    <!-- Sliding Wall Movement Indicator -->
    <text x="380" y="190" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle" transform="rotate(-90 380 190)">
      ↔ KAYAR PANEL
    </text>

    <!-- Entrance Door -->
    <line x1="60" y1="330" x2="60" y2="360" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M60 330 A30 30 0 0 1 90 360" class="door-arc"/>
    <text x="35" y="348" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#2563EB">GİRİŞ</text>

    <!-- Windows -->
    <rect x="250" y="106" width="60" height="8" class="window-rect"/>
    <rect x="430" y="106" width="60" height="8" class="window-rect"/>
    <rect x="590" y="106" width="60" height="8" class="window-rect"/>
    <rect x="250" y="446" width="80" height="8" class="window-rect"/>
  </g>

  <!-- ==================================================================== -->
  <!-- FLOOR 2: ÜST KAT (UPPER FLOOR) -->
  <!-- ==================================================================== -->
  <g id="floor-upper" data-floor-view="upper" style="display: none;">
    <text x="45" y="70" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#0F172A">ÜST KAT PLAN ŞEMASI</text>
    <text x="45" y="88" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Gece Mahremiyet, Yatak Odaları &amp; Özel Islak Hacim Katı</text>

    <!-- ROOM 1: EBEVEYN YATAK ODASI -->
    <g class="interactive-room-group">
      <rect x="190" y="110" width="220" height="160" rx="4" class="room-shape" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"
            data-room="master" data-floor="upper" tabindex="0" role="button" aria-label="Ebeveyn Yatak Odası kararını incele"/>
      <text x="300" y="175" class="room-title" text-anchor="middle" fill="#1E40AF">Ebeveyn Odası</text>
      <text x="300" y="195" class="room-area" text-anchor="middle">16 - 18 m²</text>
      <text x="300" y="212" class="room-tag" text-anchor="middle">Zorunlu • Özel Süit</text>
    </g>

    <!-- ROOM 2: EBEVEYN BANYOSU -->
    <g class="interactive-room-group">
      <rect x="60" y="110" width="130" height="100" rx="4" class="room-shape" 
            data-room="mbath" data-floor="upper" tabindex="0" role="button" aria-label="Ebeveyn Banyosu kararını incele"/>
      <text x="125" y="155" class="room-title" text-anchor="middle">Ebeveyn Banyosu</text>
      <text x="125" y="172" class="room-area" text-anchor="middle">4 - 5 m²</text>
    </g>

    <!-- ROOM 3: ÇAMAŞIR ODASI -->
    <g class="interactive-room-group">
      <rect x="60" y="210" width="130" height="60" rx="4" class="room-shape" 
            data-room="laundry" data-floor="upper" tabindex="0" role="button" aria-label="Çamaşır Odası kararını incele"/>
      <text x="125" y="240" class="room-title" text-anchor="middle">Çamaşır Odası</text>
      <text x="125" y="255" class="room-area" text-anchor="middle">3 - 4 m²</text>
    </g>

    <!-- ROOM 4: ÇOCUK ODASI 1 -->
    <g class="interactive-room-group">
      <rect x="410" y="110" width="150" height="160" rx="4" class="room-shape" 
            data-room="child1" data-floor="upper" tabindex="0" role="button" aria-label="Çocuk Odası 1 kararını incele"/>
      <text x="485" y="175" class="room-title" text-anchor="middle">Çocuk Odası 1</text>
      <text x="485" y="195" class="room-area" text-anchor="middle">11 - 13 m²</text>
      <text x="485" y="212" class="room-tag" text-anchor="middle">Zorunlu</text>
    </g>

    <!-- ROOM 5: ÇOCUK ODASI 2 -->
    <g class="interactive-room-group">
      <rect x="560" y="110" width="150" height="160" rx="4" class="room-shape" 
            data-room="child2" data-floor="upper" tabindex="0" role="button" aria-label="Çocuk Odası 2 kararını incele"/>
      <text x="635" y="175" class="room-title" text-anchor="middle">Çocuk Odası 2</text>
      <text x="635" y="195" class="room-area" text-anchor="middle">11 - 13 m²</text>
      <text x="635" y="212" class="room-tag" text-anchor="middle">Zorunlu</text>
    </g>

    <!-- ROOM 6: ORTAK BANYO -->
    <g class="interactive-room-group">
      <rect x="560" y="270" width="150" height="120" rx="4" class="room-shape" 
            data-room="bath" data-floor="upper" tabindex="0" role="button" aria-label="Ortak Banyo kararını incele"/>
      <text x="635" y="325" class="room-title" text-anchor="middle">Ortak Banyo</text>
      <text x="635" y="342" class="room-area" text-anchor="middle">5 - 6 m²</text>
    </g>

    <!-- ROOM 7: MERDİVEN HOLÜ (ALIGNED AT X=430) -->
    <g class="interactive-room-group">
      <rect x="430" y="270" width="130" height="180" rx="4" class="room-shape" fill="#F8FAFC"
            data-room="stair" data-floor="upper" tabindex="0" role="button" aria-label="Üst Kat Merdiven Holü kararını incele"/>
      <text x="495" y="340" class="room-title" text-anchor="middle">Merdiven Holü</text>
      <text x="495" y="358" class="room-area" text-anchor="middle">8 - 10 m²</text>
      <!-- Stair treads -->
      <line x1="440" y1="285" x2="550" y2="285" class="stair-tread"/>
      <line x1="440" y1="297" x2="550" y2="297" class="stair-tread"/>
      <line x1="440" y1="309" x2="550" y2="309" class="stair-tread"/>
      <line x1="440" y1="321" x2="550" y2="321" class="stair-tread"/>
      <line x1="440" y1="333" x2="550" y2="333" class="stair-tread"/>
      <text x="495" y="425" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle">İNİŞ ▼</text>
    </g>

    <!-- ROOM 8: EBEVEYN BALKONU -->
    <g class="interactive-room-group">
      <rect x="190" y="270" width="220" height="80" rx="4" class="room-shape" fill="#FFFBEB" stroke-dasharray="4 3"
            data-room="balcony" data-floor="upper" tabindex="0" role="button" aria-label="Ebeveyn Balkonu kararını incele"/>
      <text x="300" y="305" class="room-title" text-anchor="middle" fill="#B45309">Ebeveyn Balkonu</text>
      <text x="300" y="322" class="room-area" text-anchor="middle">8 - 10 m² (Açık)</text>
    </g>

    <!-- ARCHITECTURAL WALLS -->
    <path d="M60 110 L710 110 L710 390 L430 390 L430 450 L190 450 L190 350 L60 350 Z" class="wall-outer"/>
    <line x1="190" y1="110" x2="190" y2="350" class="wall-inner"/>
    <line x1="410" y1="110" x2="410" y2="270" class="wall-inner"/>
    <line x1="560" y1="110" x2="560" y2="390" class="wall-inner"/>
    <line x1="60" y1="210" x2="190" y2="210" class="wall-inner"/>
    <line x1="60" y1="270" x2="710" y2="270" class="wall-inner"/>

    <!-- Windows -->
    <rect x="250" y="106" width="60" height="8" class="window-rect"/>
    <rect x="450" y="106" width="50" height="8" class="window-rect"/>
    <rect x="600" y="106" width="50" height="8" class="window-rect"/>
  </g>

  <!-- Legend Footer -->
  <text x="60" y="535" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2563EB">
    🔍 Alternatif B: Esnek Bağlantı — Açık ada mutfak, kayar panelli çalışma alanı &amp; akışkan yaşama kurgusu.
  </text>
</svg>
