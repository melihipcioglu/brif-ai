<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%" id="planSvgA">
  <style>
    .plan-wall { stroke: #1C1C1E; stroke-width: 4; fill: none; }
    .plan-partition { stroke: #3F5E4D; stroke-width: 2.5; fill: none; }
    .plan-room { fill: #FAF9F6; stroke: #E4E0D7; stroke-width: 1.5; cursor: pointer; transition: all 0.2s ease; }
    .plan-room:hover { fill: #EEF3F0; stroke: #3F5E4D; }
    .plan-room.selected { fill: #E8F0FE; stroke: #1A73E8; stroke-width: 2; }
    .room-title { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #1C1C1E; pointer-events: none; }
    .room-area { font-family: 'Inter', sans-serif; font-size: 11px; fill: #5C5C60; pointer-events: none; }
    .door-arc { fill: none; stroke: #2563EB; stroke-width: 1.5; stroke-dasharray: 3 2; }
  </style>

  <!-- Canvas Background -->
  <rect width="700" height="480" rx="10" fill="#FFFFFF" stroke="#E4E0D7" stroke-width="1"/>
  
  <!-- Conceptual Draft Warning Banner -->
  <rect x="20" y="15" width="660" height="28" rx="6" fill="#FEF7E0" stroke="#B06000" stroke-width="1"/>
  <text x="350" y="33" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#B06000" text-anchor="middle">
    ⚠️ Kavramsal taslak — mimari proje, uygulama veya ruhsat çizimi değildir.
  </text>

  <!-- North Arrow -->
  <g transform="translate(640, 75)">
    <circle cx="0" cy="0" r="16" fill="#FAF9F6" stroke="#3F5E4D" stroke-width="1.5"/>
    <path d="M0 -10 L5 6 L0 2 L-5 6 Z" fill="#3F5E4D"/>
    <text x="0" y="14" font-family="sans-serif" font-size="9" font-weight="700" fill="#3F5E4D" text-anchor="middle">K</text>
  </g>

  <!-- ROOM 1: GİRİŞ VE VESTİYER -->
  <g class="plan-room-group" data-room="entry" data-name="Giriş ve Vestiyer" data-area="8-10 m²" data-rationale="Ana sirkülasyon başlangıcı, mahremiyet süzgeci.">
    <rect x="60" y="200" width="100" height="110" class="plan-room"/>
    <text x="110" y="250" class="room-title" text-anchor="middle">Giriş / Antre</text>
    <text x="110" y="268" class="room-area" text-anchor="middle">8 - 10 m²</text>
  </g>

  <!-- ROOM 2: YAŞAM ALANI (SALON) -->
  <g class="plan-room-group" data-room="living" data-name="Yaşam Alanı (Salon)" data-area="32-38 m²" data-rationale="Güney cepheli, teras bağlantılı ana aile toplanma mekânı.">
    <rect x="160" y="200" width="220" height="180" class="plan-room"/>
    <text x="270" y="280" class="room-title" text-anchor="middle">Yaşam Alanı (Salon)</text>
    <text x="270" y="300" class="room-area" text-anchor="middle">32 - 38 m²</text>
  </g>

  <!-- ROOM 3: MUTFAK VE YEMEK -->
  <g class="plan-room-group" data-room="kitchen" data-name="Mutfak ve Yemek" data-area="18-22 m²" data-rationale="Yarı kapalı, yaşam alanından bağımsız ama servise yakın kurgu.">
    <rect x="160" y="70" width="150" height="130" class="plan-room"/>
    <text x="235" y="130" class="room-title" text-anchor="middle">Mutfak &amp; Yemek</text>
    <text x="235" y="148" class="room-area" text-anchor="middle">18 - 22 m²</text>
  </g>

  <!-- ROOM 4: TAM AYRI ÇALIŞMA ODASI (ISOLATED STUDY) -->
  <g class="plan-room-group" data-room="study" data-name="Tam Ayrı Çalışma Odası" data-area="12-14 m²" data-rationale="Salondan akustik ve duvarla tam izole, kuzey-doğu ışığı alan çalışma mekânı.">
    <rect x="310" y="70" width="130" height="130" class="plan-room" fill="#EEF3F0" stroke="#3F5E4D" stroke-width="2"/>
    <text x="375" y="125" class="room-title" text-anchor="middle" fill="#2A4034">Çalışma Odası</text>
    <text x="375" y="142" class="room-title" text-anchor="middle" font-size="10" fill="#137333">(Ayrı Bölüm)</text>
    <text x="375" y="160" class="room-area" text-anchor="middle">12 - 14 m²</text>
  </g>

  <!-- ROOM 5: ÇOCUK ODALARI SİTESİ -->
  <g class="plan-room-group" data-room="children" data-name="Çocuk Alanı" data-area="24-28 m²" data-rationale="Saat 16:00 sonrası hareketlilik alanı, gece mahremiyet kanadında.">
    <rect x="440" y="70" width="200" height="150" class="plan-room"/>
    <text x="540" y="140" class="room-title" text-anchor="middle">Çocuk Odaları</text>
    <text x="540" y="158" class="room-area" text-anchor="middle">24 - 28 m²</text>
  </g>

  <!-- ROOM 6: EBEVEYN SUİTİ -->
  <g class="plan-room-group" data-room="master" data-name="Ebeveyn Süiti" data-area="22-26 m²" data-rationale="Gece kuşağında, özel banyolu ve sessiz arka cephede.">
    <rect x="440" y="220" width="200" height="160" class="plan-room"/>
    <text x="540" y="290" class="room-title" text-anchor="middle">Ebeveyn Süiti</text>
    <text x="540" y="310" class="room-area" text-anchor="middle">22 - 26 m²</text>
  </g>

  <!-- ROOM 7: TERAS / AÇIK ALAN -->
  <g class="plan-room-group" data-room="terrace" data-name="Açık Alan / Teras" data-area="16-20 m²" data-rationale="Salona doğrudan bağlı bahçe ve dış mekân entegrasyonu.">
    <rect x="160" y="380" width="220" height="60" class="plan-room" fill="#FAF8FE" stroke-dasharray="4 2"/>
    <text x="270" y="415" class="room-title" text-anchor="middle">Peyzaj Terası</text>
    <text x="270" y="430" class="room-area" text-anchor="middle">16 - 20 m²</text>
  </g>

  <!-- ROOM 8: ORTAK BANYO -->
  <g class="plan-room-group" data-room="bathroom" data-name="Ortak Banyo &amp; WC" data-area="6-8 m²" data-rationale="Giriş ve gece koridoru kesişiminde merkezi erişim.">
    <rect x="60" y="120" width="100" height="80" class="plan-room"/>
    <text x="110" y="155" class="room-title" text-anchor="middle">Banyo / WC</text>
    <text x="110" y="170" class="room-area" text-anchor="middle">6 - 8 m²</text>
  </g>

  <!-- WALL OUTLINES -->
  <!-- Outer Perimeter Wall -->
  <path d="M60 70 L640 70 L640 380 L160 380 L160 310 L60 310 Z" class="plan-wall"/>

  <!-- Main Partition Walls -->
  <line x1="160" y1="70" x2="160" y2="380" class="plan-partition"/>
  <line x1="310" y1="70" x2="310" y2="200" class="plan-partition"/>
  <line x1="440" y1="70" x2="440" y2="380" class="plan-partition"/>
  <line x1="160" y1="200" x2="440" y2="200" class="plan-partition"/>
  <line x1="440" y1="220" x2="640" y2="220" class="plan-partition"/>

  <!-- Doors & Openings -->
  <path d="M160 230 A20 20 0 0 1 180 250" class="door-arc"/>
  <path d="M310 130 A20 20 0 0 1 330 150" class="door-arc"/>

  <!-- Plan Legend Footer -->
  <text x="60" y="465" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#3F5E4D">
    Alternatif A: Kontrollü Ayrışma — Yüksek Akustik Mahremiyet Kurgusu
  </text>
</svg>
