  <text x="105" y="163" font-family="sans-serif" font-size="8" font-weight="600" fill="#FFFFFF">ÇOCUK</text>

  <!-- Visual Sightline Arrow -->
  <path d="M260 140 C210 115 160 135 110 155" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="260" cy="140" r="3" fill="#2563EB"/>
  <circle cx="110" cy="155" r="3" fill="#2563EB"/>

  <text x="200" y="248" font-family="sans-serif" font-size="12" font-weight="700" fill="#1C1C1E" text-anchor="middle">Ebeveyn &amp; Çocuk Görsel Görüş Hattı</text>
</svg>
