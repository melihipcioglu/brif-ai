<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="12" fill="#FAF9F6" stroke="#E4E0D7" stroke-width="1"/>

  <!-- Base Floor -->
  <polygon points="60,170 200,230 340,170 200,110" fill="#F4F2EB" stroke="#3F5E4D" stroke-width="2"/>
  
  <!-- Back Wall -->
  <polygon points="60,170 60,70 200,10 200,110" fill="#EFECE5" stroke="#3F5E4D" stroke-width="2"/>
  <polygon points="200,110 200,10 340,70 340,170" fill="#EFECE5" stroke="#3F5E4D" stroke-width="2"/>

  <!-- Half Wall / Low Partition -->
  <polygon points="140,185 140,135 220,100 220,150" fill="#E4E0D7" stroke="#3F5E4D" stroke-width="2"/>

  <!-- Parent Lounge Zone on Right -->
