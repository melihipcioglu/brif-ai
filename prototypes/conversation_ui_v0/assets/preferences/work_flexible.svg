<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="12" fill="#FAF9F6" stroke="#E4E0D7" stroke-width="1"/>

  <!-- Base Floor -->
  <polygon points="60,170 200,230 340,170 200,110" fill="#F4F2EB" stroke="#3F5E4D" stroke-width="2"/>
  
  <!-- Back Wall -->
  <polygon points="60,170 60,70 200,10 200,110" fill="#EFECE5" stroke="#3F5E4D" stroke-width="2"/>
  <polygon points="200,110 200,10 340,70 340,170" fill="#EFECE5" stroke="#3F5E4D" stroke-width="2"/>

  <!-- Sliding Track on Top Wall -->
  <line x1="120" y1="105" x2="220" y2="148" stroke="#3F5E4D" stroke-width="4"/>

  <!-- Sliding Wood Panel (Partially Open) -->
  <polygon points="150,192 150,92 195,112 195,212" fill="#B08D57" stroke="#2A4034" stroke-width="2"/>
  <!-- Panel Slat Lines -->
  <line x1="165" y1="99" x2="165" y2="199" stroke="#8C6D3F" stroke-width="1"/>
  <line x1="180" y1="106" x2="180" y2="206" stroke="#8C6D3F" stroke-width="1"/>

  <!-- Arrow Indicating Sliding Motion -->
  <g transform="translate(210, 160)">
    <path d="M-15 0 L15 0 M10 -6 L16 0 L10 6" fill="none" stroke="#3F5E4D" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Flexibility Icon -->
  <g transform="translate(300, 60)">
    <circle cx="0" cy="0" r="16" fill="#EEF3F0" stroke="#3F5E4D" stroke-width="1.5"/>
    <path d="M-6 -6 L6 6 M6 -6 L-6 6" fill="none" stroke="#3F5E4D" stroke-width="2"/>
  </g>

  <text x="200" y="248" font-family="sans-serif" font-size="12" font-weight="700" fill="#1C1C1E" text-anchor="middle">Kayar Panelli Dönüştürülebilir Esnek Alan</text>
</svg>
